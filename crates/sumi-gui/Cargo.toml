[package]
name = "sumi-gui"
description = "Sumi — Qt Quick desktop app for ASUS monitors (talks to sumid over D-Bus)"
version.workspace = true
edition.workspace = true
authors.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "sumi-app"
path = "src/main.rs"

[dependencies]
cxx = "1.0.198"
cxx-qt = "0.10.0"
cxx-qt-lib = { version = "0.10.0", features = ["qt_gui", "qt_qml", "qt_quickcontrols"] }
serde.workspace = true
serde_json.workspace = true
zbus = { version = "5.13.2", default-features = false, features = ["blocking-api", "async-io"] }
# zbus serves objects on tokio when sumid (same workspace) switches that feature on.
tokio = { version = "1.53", features = ["rt-multi-thread"] }

[build-dependencies]
cxx-qt-build = "0.10.0"

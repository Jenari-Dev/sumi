[workspace]
resolver = "2"
members = ["crates/sumi-proto", "crates/sumi-ddc", "crates/sumi-core", "crates/sumi", "crates/sumid", "crates/sumi-ai", "crates/sumi-gui"]

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["JenAriDev"]
rust-version = "1.85"
license = "GPL-2.0-or-later"
repository = "https://github.com/Jenari-Dev/sumi"

[workspace.dependencies]
sumi-proto = { path = "crates/sumi-proto" }
sumi-ddc = { path = "crates/sumi-ddc" }
sumi-core = { path = "crates/sumi-core" }
thiserror = "2"
libc = "0.2"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
